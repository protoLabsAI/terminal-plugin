id: terminal
name: Terminal
version: 0.7.0
description: >-
  A full terminal in the protoAgent console — an xterm.js view wired to a real PTY
  shell over a WebSocket. The terminal is themed from the protoAgent design system
  (it reads the console's --pl-* tokens and re-themes live). The WebSocket is gated
  by the operator bearer (the same token the console uses), so only the authenticated
  operator gets a shell. Enabled by default: the bearer gate is the real protection,
  and protoAgent only binds non-loopback when a token is set — so an un-gated shell is
  always loopback-local. (Disable it explicitly if you don't want a terminal.)
enabled: true
repository: https://github.com/protoLabsAI/terminal-plugin
min_protoagent_version: "0.82.0"   # views (ADR 0026) + WS-through-proxy (#883) + live_config + background mount (#1640)

# Linux/macOS use the stdlib PTY (no deps). Windows is EXPERIMENTAL (untested in CI)
# and needs pywinpty — declared, NOT auto-installed (install-deps it on Windows).
requires_pip:
  - "pywinpty>=2.0; sys_platform == 'win32'"

config_section: terminal
config:
  shell: ""                 # the shell to spawn; blank → $SHELL, then /bin/bash
  cwd: ""                   # working dir the shell starts in; blank → the server's cwd
  scrollback: 5000          # xterm scrollback lines
  font_size: 13             # xterm font size (px)
  keep_alive_minutes: 30    # a shell with no attached view survives this long (0 = end it on disconnect)
  max_sessions: 12          # live shells allowed at once (across every open console)
  login_shell: true         # start the shell as a login shell (reads ~/.zprofile etc — PATH like your usual terminal)
  font_family: ""           # blank → the console's mono font, then Menlo/Monaco
  cursor_style: block       # block | bar | underline
  option_as_meta: false     # macOS: Option sends Meta (Alt+b/f word-jumps) instead of typing ∑/ƒ/…
  copy_on_select: false     # copy a selection to the clipboard as soon as it's made
  agent_access: run         # off | read (list/read tabs) | run (+ run commands in, and open, tabs)
  # auth_token is NOT configured here — the WS verifies the connecting token against
  # the host's operator bearer (config auth.token / A2A_AUTH_TOKEN). When the host has
  # no bearer set (loopback dev), the WS is open on the bound interface — only enable
  # this plugin on a token-gated or loopback-only deployment.

# Settings ▸ Plugins ▸ Terminal. Read live (registry.live_config): font/scrollback apply on
# the next view load, shell/cwd to the next new shell, keep-alive/limit immediately.
settings:
  - { key: shell, label: "Shell", type: string, description: "The shell to spawn. Blank uses $SHELL, then /bin/bash." }
  - { key: cwd, label: "Starting directory", type: string, description: "Where a new shell starts. Blank uses the server's working directory." }
  - { key: font_size, label: "Font size (px)", type: number, description: "Terminal font size, 8-32. Applies when the view next loads." }
  - { key: scrollback, label: "Scrollback (lines)", type: number, description: "Lines of history each terminal keeps. Applies when the view next loads." }
  - { key: keep_alive_minutes, label: "Keep detached shells (minutes)", type: number, description: "How long a shell keeps running with no terminal attached (view closed, reload, network drop) before it is ended. 0 ends it on disconnect." }
  - { key: max_sessions, label: "Max open shells", type: number, description: "Live shells allowed at once, across every open console." }
  - { key: login_shell, label: "Login shell", type: bool, description: "Start shells as login shells, so ~/.zprofile / ~/.bash_profile run and PATH matches your usual terminal. Applies to new shells." }
  - { key: font_family, label: "Font family", type: string, description: "A CSS font list, e.g. \"JetBrains Mono, Menlo\". Blank uses the console's monospace font. Applies when the view next loads." }
  - { key: cursor_style, label: "Cursor style", type: select, options: [block, bar, underline], description: "The cursor shape. Applies when the view next loads." }
  - { key: option_as_meta, label: "Option as Meta (macOS)", type: bool, description: "Option sends Meta, so Option+B/F jump words in the shell. Off: Option types special characters (∑, ƒ, #…). Applies when the view next loads." }
  - { key: copy_on_select, label: "Copy on select", type: bool, description: "Copy a selection to the clipboard as soon as you make it (X11/iTerm style)." }
  - { key: agent_access, label: "Agent access", type: select, options: [run, read, "off"], description: "What the agent may do with your terminals. run: read them, and run commands visibly in its own Agent tab (or one you name), and open tabs for you. read: only list and read them (e.g. \"what's this error?\"). off: nothing. Terminal output you let it read goes to your model gateway. Applies immediately." }

# Console view (ADR 0026) — a left-rail icon whose panel iframes the terminal page.
# Served on the PUBLIC /plugins/<id> prefix (an iframe page-load can't carry a bearer);
# the WebSocket carries the operator bearer in its first (auth) frame and it is verified
# in the handler (a browser WS can't set an Authorization header).
views:
  - { id: terminal, label: "Terminal", icon: SquareTerminal, path: /plugins/terminal/view }

# The vendored xterm assets the view page loads. The host auto-exempts the view PAGE path,
# but a <script>/<link> load can't carry an Authorization header any more than the iframe
# navigation can — so without this, on any token-gated deployment xterm 401s and the view
# is a dead "Could not load the terminal assets" box. (Static, non-secret files only; the
# WS does its own bearer check.)
public_paths:
  - "/plugins/terminal/static/"

# Bus topics (ADR 0039). The view subscribes to terminal.# to add tabs the agent opens.
emits:
  - terminal.session_opened   # {session, name, focus} — a tool opened a terminal tab

# Declarative transparency (surfaced in the console; not enforced).
capabilities:
  network: []                     # none — xterm.js + addons are VENDORED + served locally (offline)
  filesystem: full                # it spawns an interactive shell — full host access for the operator
