name: CI

# Lint + test on the org's Namespace Linux profile (override NSC_RUNNER on a fork
# that lacks it). The suite is host-free (only requirements-dev.txt) and spawns real
# PTYs (Linux runners have them), so it exercises the actual shell bridge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    timeout-minutes: 8   # safety net — these tests drive real PTYs + a WebSocket
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test (Python)
        run: pytest -q

      - name: Test (view JS)
        run: node --test tests/js/*.test.mjs

  # The Windows backend (pywinpty) — a real cmd.exe through WinPtySession and the whole
  # WebSocket bridge. The POSIX suites skip themselves here; tests/test_winpty.py only
  # runs here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps + pywinpty
        run: pip install -r requirements-dev.txt "pywinpty>=2.0"

      - name: Test (Windows backend)
        run: pytest -q tests/test_winpty.py tests/test_packaging.py tests/test_textutil.py
